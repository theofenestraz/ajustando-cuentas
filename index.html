<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2740">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<title>Ajustando Cuentas</title>
<meta name="description" content="Apunta tus gastos e ingresos y reparte tu ahorro en proyectos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/barlow-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></symbol>
    <symbol id="i-line" viewBox="0 0 24 24"><path d="M2 12h4.5M11.5 12h1M17.5 12H22"/><circle cx="9" cy="12" r="2.5"/><circle cx="15" cy="12" r="2.5"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-del" viewBox="0 0 24 24"><path d="M9 6h11v12H9l-6-6z"/><path d="M12.5 9.5l5 5M17.5 9.5l-5 5"/></symbol>
    <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M4 11V9a3 3 0 0 1 3-3h12"/><path d="m16 3 3 3-3 3"/><path d="M20 13v2a3 3 0 0 1-3 3H5"/><path d="m8 21-3-3 3-3"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v14"/><path d="m6 12 6 6 6-6"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V6"/><path d="m6 12 6-6 6 6"/></symbol>
    <symbol id="i-gift" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="5"/><path d="M5 13v8h14v-8M12 8v13"/><path d="M12 8c-2-4-6-4-6-1.5S9 8 12 8c3 0 6-.5 6-1.5S14 4 12 8z"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/></symbol>
  </defs>
</svg>

<div class="app" id="app">
  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Secciones">
    <a href="#hoy" data-tab="hoy"><svg><use href="#i-home"/></svg><span>Hoy</span></a>
    <a href="#mes" data-tab="mes"><svg><use href="#i-chart"/></svg><span>Mes</span></a>
    <button class="add" id="addBtn" type="button" aria-label="Apuntar movimiento"><svg><use href="#i-plus"/></svg></button>
    <a href="#ahorro" data-tab="ahorro"><svg><use href="#i-line"/></svg><span>Ahorro</span></a>
    <a href="#ajustes" data-tab="ajustes"><svg><use href="#i-gear"/></svg><span>Ajustes</span></a>
  </nav>
</div>

<dialog class="sheet" id="sheet" aria-labelledby="sheetTitle"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=4"></script>
</body>
</html>
